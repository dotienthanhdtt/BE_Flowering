name: Build & Push Image

# Deployment itself is handled by Railway's GitHub integration (auto-deploys on
# push). This workflow only builds the production image and publishes it to
# Docker Hub as a registry artifact.

on:
  push:
    branches: [main, dev]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build, Test, Push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME: be-flowering

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=production" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck)
        run: npm run build

      - name: Test
        run: npm test -- --ci --runInBand

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.tag }}
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
